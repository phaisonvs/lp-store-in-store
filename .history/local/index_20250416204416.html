<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seja um Franqueado - Experiência Imersiva</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Seção com efeito parallax e partículas -->
  <section class="parallax-section">
    <!-- Container para as camadas do parallax -->
    <div class="parallax-container">
      <div class="parallax-layer parallax-bg" data-depth="0.1"></div>
      <div class="parallax-layer parallax-middle" data-depth="0.3"></div>
      <div class="parallax-layer parallax-front" data-depth="0.6"></div>

      <!-- Container para as partículas -->
      <div id="particles"></div>
    </div>

    <!-- Conteúdo principal centralizado -->
    <div class="content-wrapper">
      <h1 class="magic-title">Seja um Franqueado</h1>
      <p class="text-details">
        Entre para o nosso time e faça parte de uma rede com mais de 20 anos de sucesso.
        Nossa franquia oferece um modelo de negócio sólido, com suporte completo e alta
        rentabilidade. Transforme sua vida profissional e alcance a independência financeira.
      </p>
      <button class="btn-primary">Quero Saber Mais</button>
    </div>
  </section>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
